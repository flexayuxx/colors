<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYUSH — Color Explorer</title>

<style>

/* =========================================================
   AYUSH COLOR EXPLORER
   ========================================================= */

:root {
    --bg: #050505;
    --panel: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.11);
    --text: #ffffff;
    --muted: rgba(255,255,255,0.52);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x: hidden;
}

button,
input {
    font: inherit;
}

/* =========================================================
   BACKGROUND
   ========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(120,70,255,0.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(255,50,150,0.10),
            transparent 28%
        ),
        #050505;
}

.orb {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .25;
    animation: float 14s ease-in-out infinite;
}

.orb.one {
    background: #743cff;
    left: -180px;
    top: -140px;
}

.orb.two {
    background: #ff3c9e;
    right: -180px;
    top: 25%;
    animation-delay: -5s;
}

.orb.three {
    background: #006eff;
    left: 35%;
    bottom: -230px;
    animation-delay: -9s;
}

@keyframes float {

    0%,100% {
        transform: translate3d(0,0,0) scale(1);
    }

    50% {
        transform: translate3d(50px,-40px,0) scale(1.12);
    }
}

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        radial-gradient(
            circle at center,
            black,
            transparent 82%
        );
}

/* =========================================================
   NAVBAR
   ========================================================= */

.navbar {
    width: min(1250px, calc(100% - 40px));
    margin: auto;

    padding: 28px 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 15px;
    font-weight: 800;

    letter-spacing: .28em;
}

.logo-mark {
    width: 30px;
    height: 30px;

    border-radius: 10px;

    background:
        conic-gradient(
            from 180deg,
            #ff3030,
            #ffcc00,
            #35d65b,
            #00c7ff,
            #6255ff,
            #ff2f88,
            #ff3030
        );

    box-shadow:
        0 0 30px rgba(255,255,255,.16);

    animation: logoSpin 8s linear infinite;
}

@keyframes logoSpin {
    to {
        transform: rotate(360deg);
    }
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.badge {
    padding: 9px 15px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: rgba(255,255,255,.04);
    backdrop-filter: blur(15px);

    color: var(--muted);

    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
    width: min(1250px, calc(100% - 40px));
    margin: auto;

    padding-top: 95px;
    padding-bottom: 80px;

    text-align: center;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    margin-bottom: 25px;

    color: rgba(255,255,255,.48);

    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
}

.live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 18px white;

    animation: pulse 2s infinite;
}

@keyframes pulse {

    50% {
        opacity: .3;
        transform: scale(.6);
    }
}

.hero h1 {
    font-size:
        clamp(55px, 9vw, 120px);

    line-height: .88;

    letter-spacing: -.075em;

    font-weight: 800;

    background:
        linear-gradient(
            110deg,
            #fff,
            #bcb5ff,
            #ffb7db,
            #fff
        );

    background-size: 220% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 7s linear infinite;
}

@keyframes gradientMove {

    to {
        background-position: 220% center;
    }
}

.hero-description {
    max-width: 650px;

    margin: 30px auto 0;

    color: var(--muted);

    font-size: 15px;
    line-height: 1.8;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-container {
    width: min(650px, 100%);

    margin: 50px auto 30px;

    position: relative;
}

.search-icon {
    position: absolute;

    left: 18px;
    top: 50%;

    transform: translateY(-50%);

    opacity: .45;

    font-size: 18px;
}

#search {
    width: 100%;

    padding: 17px 20px 17px 50px;

    border:
        1px solid rgba(255,255,255,.13);

    border-radius: 18px;

    outline: none;

    background:
        rgba(255,255,255,.055);

    color: white;

    backdrop-filter: blur(20px);

    transition:
        border .3s,
        background .3s,
        box-shadow .3s;
}

#search::placeholder {
    color: rgba(255,255,255,.32);
}

#search:focus {
    border-color:
        rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.08);

    box-shadow:
        0 0 40px rgba(255,255,255,.05);
}

/* =========================================================
   CATEGORIES
   ========================================================= */

.categories {
    display: flex;

    justify-content: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 45px;
}

.category {
    padding: 9px 15px;

    border:
        1px solid rgba(255,255,255,.09);

    border-radius: 999px;

    background:
        rgba(255,255,255,.035);

    color:
        rgba(255,255,255,.55);

    cursor: pointer;

    font-size: 11px;

    transition:
        .3s;
}

.category:hover,
.category.active {
    background:
        rgba(255,255,255,.13);

    border-color:
        rgba(255,255,255,.28);

    color: white;

    transform:
        translateY(-2px);
}

/* =========================================================
   COLOR GRID
   ========================================================= */

.color-grid {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 13px;
}

.color-card {
    position: relative;

    height: 155px;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 22px;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        box-shadow .5s,
        border .3s;

    text-align: left;

    color: white;
}

.color-card:hover {

    transform:
        translateY(-9px)
        scale(1.025);

    border-color:
        rgba(255,255,255,.4);

    box-shadow:
        0 25px 60px rgba(0,0,0,.45);
}

.color-card:hover .shine {
    transform:
        translateX(120%)
        rotate(15deg);
}

.swatch {
    position: absolute;
    inset: 0;
}

.shine {
    position: absolute;

    inset: -100%;

    background:
        linear-gradient(
            115deg,
            transparent 42%,
            rgba(255,255,255,.4) 50%,
            transparent 58%
        );

    transform:
        translateX(-120%)
        rotate(15deg);

    transition:
        transform .9s ease;
}

.color-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            transparent 35%,
            rgba(0,0,0,.55)
        );
}

.color-info {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 14px;

    z-index: 3;

    text-shadow:
        0 3px 15px rgba(0,0,0,.6);
}

.color-name {
    font-size: 13px;
    font-weight: 750;
}

.color-code {
    margin-top: 4px;

    font-family: monospace;

    font-size: 9px;

    opacity: .75;
}

.color-count {
    color:
        rgba(255,255,255,.3);

    font-size: 10px;

    margin-top: 20px;

    text-align: center;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer {
    width: min(1250px, calc(100% - 40px));

    margin: 40px auto 0;

    padding:
        30px 0 40px;

    border-top:
        1px solid rgba(255,255,255,.08);

    display: flex;

    justify-content: space-between;

    color:
        rgba(255,255,255,.3);

    font-size: 10px;

    letter-spacing: .08em;
}

/* =========================================================
   FULL SCREEN COLOR EXPERIENCE
   ========================================================= */

.experience {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    visibility: hidden;

    opacity: 0;

    transform: scale(1.05);

    transition:
        opacity .6s ease,
        transform .8s cubic-bezier(.16,1,.3,1),
        visibility .6s;
}

.experience.active {
    visibility: visible;

    opacity: 1;

    transform: scale(1);
}

.experience-bg {
    position: absolute;

    inset: 0;

    background: #000;

    transition:
        background .8s ease;
}

.experience-bg::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,255,255,.32),
            transparent 25%
        );
}

.experience-bg::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 20% 80%,
            rgba(255,255,255,.10),
            transparent 30%
        );
}

.experience-content {

    position: relative;

    z-index: 5;

    width: min(850px, calc(100% - 40px));

    text-align: center;

    color: white;
}

.experience-label {

    font-size: 11px;

    letter-spacing: .3em;

    text-transform: uppercase;

    opacity: .7;
}

.experience-name {

    margin:
        20px 0 25px;

    font-size:
        clamp(70px, 14vw, 175px);

    line-height: .84;

    letter-spacing: -.08em;

    font-weight: 850;

    text-shadow:
        0 15px 70px rgba(0,0,0,.2);
}

.experience-description {

    max-width: 600px;

    margin: auto;

    font-size: 15px;

    line-height: 1.8;

    opacity: .86;
}

.experience-values {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;

    margin-top: 30px;
}

.value {

    padding:
        11px 16px;

    border:
        1px solid rgba(255,255,255,.3);

    border-radius: 999px;

    background:
        rgba(255,255,255,.1);

    backdrop-filter:
        blur(15px);

    font-family: monospace;

    font-size: 11px;
}

.close-button {

    margin-top: 35px;

    padding:
        13px 21px;

    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 999px;

    background:
        rgba(255,255,255,.12);

    color: white;

    cursor: pointer;

    font-size: 11px;

    letter-spacing: .12em;

    text-transform: uppercase;

    transition:
        .3s;
}

.close-button:hover {

    background:
        rgba(255,255,255,.22);

    transform:
        translateY(-4px);
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 900px) {

    .color-grid {
        grid-template-columns:
            repeat(3,1fr);
    }
}

@media(max-width: 600px) {

    .navbar,
    .hero,
    footer {
        width:
            calc(100% - 28px);
    }

    .hero {
        padding-top: 65px;
    }

    .color-grid {
        grid-template-columns:
            repeat(2,1fr);
    }

    .color-card {
        height: 130px;
    }

    .nav-right {
        display: none;
    }

    footer {

        flex-direction: column;

        gap: 10px;

        text-align: center;
    }

    .experience-name {
        font-size: 72px;
    }
}

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>

/* =========================================================
   DOM
   ========================================================= */

const grid =
    document.getElementById("colorGrid");

const categories =
    document.getElementById("categories");

const search =
    document.getElementById("search");

const colorCount =
    document.getElementById("colorCount");

const experience =
    document.getElementById("experience");

const experienceBg =
    document.getElementById("experienceBg");

const experienceName =
    document.getElementById("experienceName");

const experienceDescription =
    document.getElementById("experienceDescription");

const hexValue =
    document.getElementById("hexValue");

const rgbValue =
    document.getElementById("rgbValue");

const hslValue =
    document.getElementById("hslValue");

const moodValue =
    document.getElementById("moodValue");

const closeButton =
    document.getElementById("closeButton");


/* =========================================================
   CATEGORIES
   ========================================================= */

const categoryNames = [
    "All",
    "Red",
    "Orange",
    "Yellow",
    "Green",
    "Blue",
    "Purple",
    "Pink",
    "Brown",
    "Neutral",
    "Modern"
];


let activeCategory = "All";


categoryNames.forEach(
    categoryName => {

        const button =
            document.createElement("button");

        button.type = "button";

        button.className =
            "category";

        button.textContent =
            categoryName;


        if (categoryName === "All") {
            button.classList.add("active");
        }


        button.addEventListener(
            "click",
            () => {

                activeCategory =
                    categoryName;

                document
                    .querySelectorAll(".category")
                    .forEach(
                        item =>
                            item.classList.remove(
                                "active"
                            )
                    );

                button.classList.add(
                    "active"
                );

                renderColors();

            }
        );


        categories.appendChild(button);

    }
);


/* =========================================================
   RENDER COLORS
   ========================================================= */

function renderColors() {

    const query =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        colors.filter(color => {

            const matchesCategory =
                activeCategory === "All" ||
                color.category === activeCategory;


            const matchesSearch =
                !query ||
                color.name
                    .toLowerCase()
                    .includes(query) ||

                color.hex
                    .toLowerCase()
                    .includes(query) ||

                color.mood
                    .toLowerCase()
                    .includes(query);


            return (
                matchesCategory &&
                matchesSearch
            );

        });


    grid.innerHTML = "";


    filtered.forEach(
        color => {

            const card =
                document.createElement("button");

            card.type = "button";

            card.className =
                "color-card";


            card.setAttribute(
                "aria-label",
                `Explore ${color.name}`
            );


            card.innerHTML = `

                <span
                    class="swatch"
                    style="
                        background:${color.hex}
                    "
                ></span>

                <span class="shine"></span>

                <span class="color-overlay"></span>

                <span class="color-info">

                    <span class="color-name">
                        ${color.name}
                    </span>

                    <br>

                    <span class="color-code">
                        ${color.hex}
                    </span>

                </span>

            `;


            /*
                3D TILT
            */

            card.addEventListener(
                "pointermove",
                event => {

                    if (
                        !window.matchMedia(
                            "(pointer:fine)"
                        ).matches
                    ) {
                        return;
                    }


                    const rect =
                        card.getBoundingClientRect();


                    const x =
                        (event.clientX -
                            rect.left) /
                            rect.width -
                        .5;


                    const y =
                        (event.clientY -
                            rect.top) /
                            rect.height -
                        .5;


                    card.style.transform = `

                        perspective(700px)

                        rotateX(${y * -8}deg)

                        rotateY(${x * 8}deg)

                        translateY(-9px)

                        scale(1.025)

                    `;

                }
            );


            card.addEventListener(
                "pointerleave",
                () => {

                    card.style.transform =
                        "";

                }
            );


            card.addEventListener(
                "click",
                () => {

                    openColor(color);

                }
            );


            grid.appendChild(card);

        }
    );


    colorCount.textContent =
        `${filtered.length} color${
            filtered.length === 1
                ? ""
                : "s"
        } found`;

}


/* =========================================================
   SEARCH
   ========================================================= */

search.addEventListener(
    "input",
    renderColors
);


/* =========================================================
   OPEN COLOR
   ========================================================= */

function openColor(color) {

    experienceBg.style.background =
        color.hex;


    experienceName.textContent =
        color.name.toUpperCase();


    experienceDescription.textContent =
        color.description;


    hexValue.textContent =
        color.hex;


    rgbValue.textContent =
        `RGB ${color.rgb}`;


    hslValue.textContent =
        `HSL ${color.hsl}`;


    moodValue.textContent =
        color.mood;


    experience.classList.add(
        "active"
    );


    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   CLOSE
   ========================================================= */

function closeExperience() {

    experience.classList.remove(
        "active"
    );


    document.body.style.overflow =
        "";

}


closeButton.addEventListener(
    "click",
    closeExperience
);


/* =========================================================
   ESC
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            experience.classList.contains(
                "active"
            )
        ) {

            closeExperience();

        }

    }
);


/* =========================================================
   INITIAL LOAD
   ========================================================= */

renderColors();

</script>
