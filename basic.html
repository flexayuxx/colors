
<!DOCTYPE html>
<html>
<head>
    <title>AYUSH - Colors</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0;
            transition: 0.3s;
        }

        header {
            padding: 20px;
        }

        .colors {
            margin: 40px auto;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        button {
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            margin-top: 100px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>AYUSH</h1>
        <p>Choose a color</p>
    </header>

    <div class="colors">

        <button style="background:red" onclick="changeColor('red')">
            Red
        </button>

        <button style="background:blue" onclick="changeColor('blue')">
            Blue
        </button>

        <button style="background:green" onclick="changeColor('green')">
            Green
        </button>

        <button style="background:yellow;color:black" onclick="changeColor('yellow')">
            Yellow
        </button>

        <button style="background:orange" onclick="changeColor('orange')">
            Orange
        </button>

        <button style="background:purple" onclick="changeColor('purple')">
            Purple
        </button>

        <button style="background:pink;color:black" onclick="changeColor('pink')">
            Pink
        </button>

        <button style="background:black" onclick="changeColor('black')">
            Black
        </button>

        <button style="background:white;color:black" onclick="changeColor('white')">
            White
        </button>

        <button style="background:gray" onclick="changeColor('gray')">
            Gray
        </button>

    </div>

    <footer>
        Copyright © AYUSH
    </footer>

    <script>
        function changeColor(color) {
            document.body.style.backgroundColor = color;
        }
    </script>

</body>
</html>
